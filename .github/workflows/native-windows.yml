name: SlideStrike native Windows checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-windows.yml
      - native/slidestrike/**
      - apps/slidestrike/**
      - vendor/designcraft-page/**
      - fixtures/slidestrike/**
      - README.md
      - assets/branding/**
      - assets/screenshots/**
      - docs/NATIVE_RUNTIME_ACCEPTANCE.md
      - tools/verify_geometric_identity.py
      - tools/test_verify_geometric_identity.py
      - tools/capture_native_readme.ps1

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'Gerbzz/SlideStrike'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native/slidestrike
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DECKCRAFT_REQUIRE_WINRES: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build SlideStrike desktop editor
        run: cargo build --locked -p deckcraft --bin slidestrike

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify geometric branding and embedded Windows icon payloads
        run: |
          python ../../tools/test_verify_geometric_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged icon negative controls failed' }
          python ../../tools/verify_geometric_identity.py --svg ../../assets/branding/SlideStrike-geometric.svg --png ../../assets/branding/SlideStrike-geometric.png --ico assets/app-icon/slidestrike-geometric.ico --original ../../assets/branding/SlideStrike.png --original-sha256 2006fa5bb46e7d1ecb0001fc15648b6517562c4046a7215899f4d5b1a178a2e1 --exe target/debug/slidestrike.exe | Tee-Object -FilePath "$env:RUNNER_TEMP/slidestrike-branding-proof.json"
          if ($LASTEXITCODE -ne 0) { throw 'Geometric branding verification failed' }

      - name: Test media container guards and existing formats
        run: cargo test --locked -p deckcraft-media --lib --test decode

      - name: Test older deck import and native save/reopen
        run: |
          cargo test --locked -p deckcraft-engine --lib legacy::tests::
          cargo test --locked -p deckcraft-engine --test legacy_import

      - name: Test protection of older deck destinations
        run: |
          cargo test --locked -p deckcraft-engine --lib legacy_destination_tests::

      - name: Test animation cleanup on shape and group deletion
        run: cargo test --locked -p deckcraft-engine --test animation_delete

      - name: Test distribution selection extent and undo/redo
        run: cargo test --locked -p deckcraft-engine --test distribution

      - name: Test complete engine regression suite
        run: cargo test --locked -p deckcraft-engine

      - name: Check SlideStrike CLI
        run: cargo check --locked -p deckcraft-cli

      - name: Test MCP identity and project links
        run: cargo test --locked -p deckcraft-mcp --lib handshake_and_tool_list

      - name: Capture the actual native editor with the public sample
        id: capture
        env:
          SLIDESTRIKE_CAPTURE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ../../tools/capture_native_readme.ps1 -Executable target/debug/slidestrike.exe -OutputDirectory "$env:RUNNER_TEMP/slidestrike-readme-capture"

      - name: Upload native screenshot evidence
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: slidestrike-native-readme-capture
          path: |
            ${{ runner.temp }}/slidestrike-readme-capture/*.png
            ${{ runner.temp }}/slidestrike-readme-capture/proof.json
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: slidestrike-geometric-branding-native
          path: |
            native/slidestrike/target/debug/slidestrike.exe
            ${{ runner.temp }}/slidestrike-branding-proof.json
          if-no-files-found: error
          retention-days: 1


