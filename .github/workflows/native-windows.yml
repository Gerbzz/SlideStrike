name: SlideStrike native Windows checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-windows.yml
      - native/slidestrike/**
      - apps/slidestrike/**
      - vendor/designcraft-page/**
      - fixtures/slidestrike/**

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'Gerbzz/SlideStrike'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native/slidestrike
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build SlideStrike desktop editor
        run: cargo build --locked -p deckcraft --bin slidestrike

      - name: Test older deck import and native save/reopen
        run: |
          cargo test --locked -p deckcraft-engine --lib legacy::tests::

      - name: Test protection of older deck destinations
        run: |
          cargo test --locked -p deckcraft-engine --lib legacy_destination_tests::

      - name: Check SlideStrike CLI
        run: cargo check --locked -p deckcraft-cli

      - name: Test MCP identity and project links
        run: cargo test --locked -p deckcraft-mcp --lib handshake_and_tool_list

      - name: Record native executable identity
        if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SLIDESTRIKE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $path = 'target/debug/slidestrike.exe'
          $file = Get-Item -LiteralPath $path -ErrorAction Stop
          if ($file.Length -gt 96MB) { throw 'SlideStrike executable exceeds 96 MiB artifact cap' }
          $manifest = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            buildCommit = $env:GITHUB_SHA
            sourceCommit = $env:SLIDESTRIKE_HEAD_SHA
            executable = 'slidestrike.exe'
            sizeBytes = $file.Length
            sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            profile = 'dev; debug=0; incremental=0'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath 'target/debug/slidestrike-manifest.json' -Encoding utf8

      - name: Retain executable for native acceptance
        if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slidestrike-win64-${{ github.event.pull_request.head.sha }}
          path: |
            native/slidestrike/target/debug/slidestrike.exe
            native/slidestrike/target/debug/slidestrike-manifest.json
          if-no-files-found: error
          retention-days: 1
